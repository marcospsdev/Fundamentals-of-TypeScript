<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style/style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div>
        <h1>Cadastro simples de usuário</h1>
      </div>
      <hr />
      <div class="row">
        <div class="col-6">
          <div class="form-group row">
            <label for="fullName" class="col-sm-2 col-form-label">Nome</label>
            <div class="col-sm-10">
              <input
                type="text"
                class="form-control"
                id="fullName"
                placeholder="Nome"
              />
            </div>
          </div>
          <div class="form-group row">
            <label for="register" class="col-sm-2 col-form-label"
              >Registro</label
            >
            <div class="col-sm-10">
              <input
                type="text"
                class="form-control"
                id="register"
                placeholder="Registro"
              />
            </div>
          </div>
          <fieldset class="form-group">
            <div class="row">
              <legend class="col-form-label col-sm-2 pt-0">Acesso</legend>
              <div class="col-sm-10" id="accessRadio"></div>
            </div>
          </fieldset>
          <div class="form-group row">
            <div class="col-sm-10">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="active" />
                <label class="form-check-label" for="active"> Ativo </label>
              </div>
            </div>
          </div>
          <div class="form-group row">
            <div class="col-sm-10">
              <button type="submit" id="add" class="btn btn-primary">
                Adicionar
              </button>
            </div>
          </div>
        </div>
        <div class="col-6">
          <div id="content"></div>
        </div>
      </div>
    </div>
    <script src="dist/index.js"></script>
  </body>
</html>
